<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CareerOps Cloud ATS Auto-Fill</title>
  <style>
    body {
      width: 330px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0F172A;
      color: #F8FAFC;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      border-bottom: 1px solid #1E293B;
      padding-bottom: 10px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand h2 {
      font-size: 15px;
      font-weight: 700;
      margin: 0;
      letter-spacing: -0.02em;
    }
    .badge {
      background: #0066FE;
      color: #FFFFFF;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 9999px;
      text-transform: uppercase;
    }
    .card {
      background: #1E293B;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .field-row {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      margin-bottom: 6px;
    }
    .field-label {
      color: #94A3B8;
    }
    .field-val {
      font-weight: 600;
      color: #F1F5F9;
      max-width: 180px;
      text-overflow: ellipsis;
      overflow: hidden;
      white-space: nowrap;
    }
    .cloud-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      margin-bottom: 10px;
      color: #38BDF8;
      background: rgba(56, 189, 248, 0.1);
      padding: 6px 10px;
      border-radius: 6px;
    }
    .cloud-status.synced {
      color: #34D399;
      background: rgba(52, 211, 153, 0.1);
    }
    .btn-sync {
      width: 100%;
      background: #1E293B;
      color: #93C5FD;
      border: 1px solid #3B82F6;
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 8px;
      transition: background 0.2s;
    }
    .btn-sync:hover {
      background: #2563EB;
      color: white;
    }
    .btn-fill {
      width: 100%;
      background: #0066FE;
      color: white;
      border: none;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 4px 14px rgba(0, 102, 254, 0.35);
      transition: background 0.2s;
    }
    .btn-fill:hover {
      background: #0052CC;
    }
    .supported-tags {
      font-size: 10px;
      color: #64748B;
      text-align: center;
      margin-top: 10px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <h2>CareerOps</h2>
      <span class="badge">Cloud Synced</span>
    </div>
  </div>

  <div class="cloud-status" id="cloud-status-banner">
    <span>☁️ Connected to Cloud API</span>
  </div>

  <div class="card">
    <div class="field-row">
      <span class="field-label">Candidate</span>
      <span class="field-val" id="profile-name">Akash Kaintura</span>
    </div>
    <div class="field-row">
      <span class="field-label">Email</span>
      <span class="field-val" id="profile-email">akash.k96.official@gmail.com</span>
    </div>
    <div class="field-row">
      <span class="field-label">Phone</span>
      <span class="field-val" id="profile-phone">+91 8979594537</span>
    </div>
    <div class="field-row">
      <span class="field-label">Cloud Target</span>
      <span class="field-val" id="profile-role">Lead / Senior Backend Engineer</span>
    </div>
  </div>

  <button class="btn-sync" id="btn-sync-cloud">
    🔄 Sync Profile from Cloud API
  </button>

  <button class="btn-fill" id="btn-trigger-fill">
    ⚡ 1-Click Auto-Fill Page
  </button>

  <div class="supported-tags">
    Supported ATS: Greenhouse, Lever, Workday, Ashby, BambooHR, LinkedIn
  </div>

  <script src="popup.js"></script>
</body>
</html>
