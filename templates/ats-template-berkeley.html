<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{NAME}} - Resume</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        @page { size: A4; margin: 0.4in; }
        html, body {
            background: #fff;
            hyphens: none;
            -webkit-hyphens: none;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 9.5pt;
            line-height: 1.36;
            color: #1a1a1a;
            padding: 0.4in 0.42in;
            -webkit-font-smoothing: antialiased;
        }
        @media print {
            body { padding: 0 !important; }
            a { color: #111; text-decoration: none; }
            .section-education, .edu, .edu > div,
            .section-achievements {
                page-break-inside: avoid !important;
                break-inside: avoid-page !important;
            }
        }
        .contact:empty { display: none; }
        .contact a { color: #003262; text-decoration: none; font-weight: 500; }
        .contact-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-start;
            align-items: center;
            gap: 4px 14px;
            margin-top: 3px;
        }
        .contact-item {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 8.5pt;
            color: #475569;
            line-height: 1.35;
            white-space: nowrap;
            font-weight: 500;
        }
        .container { max-width: 100%; margin: 0 auto; }
        header { text-align: left; margin-bottom: 10px; }
        h1 {
            font-size: 20pt; font-weight: 800; letter-spacing: -0.4px;
            text-transform: none; margin-bottom: 3px; line-height: 1.15;
            color: #003262;
        }
        .top-rule { margin-top: 6px; border-top: 2px solid #003262; }
        section { margin-top: 9px; }
        h2 {
            font-size: 9pt; font-weight: 800; letter-spacing: 0.6px;
            text-transform: uppercase; margin-bottom: 2px; color: #003262;
        }
        .rule { border-top: 1px solid #cbd5e1; margin-bottom: 4px; }
        .skills-lines { font-size: 9pt; line-height: 1.36; color: #334155; }
        .skill-line { margin-bottom: 2px; }
        .skill-label { font-weight: 700; color: #003262; }
        .job { margin-bottom: 7px; page-break-inside: avoid; break-inside: avoid-page; }
        .job-header {
            display: flex; justify-content: space-between; align-items: baseline;
            gap: 10px; font-size: 9.5pt; margin-bottom: 2px;
            page-break-after: avoid; break-after: avoid;
        }
        .job-header > div:first-child { flex: 1; min-width: 0; }
        .job-title { font-weight: 700; color: #0f172a; }
        .job-company { font-weight: 600; color: #003262; }
        .job-dates { font-weight: 600; color: #64748b; font-size: 8.5pt; white-space: nowrap; flex-shrink: 0; }
        .job ul { list-style-type: disc; margin: 2px 0 0 1.2em; padding: 0; }
        .job li { margin-bottom: 2px; padding-left: 2px; line-height: 1.34; color: #334155; }
        .summary-block { font-size: 9pt; line-height: 1.4; color: #334155; white-space: pre-line; }
        .edu { font-size: 9pt; line-height: 1.34; color: #334155; }
        .edu > div { margin-bottom: 2px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>{{NAME}}</h1>
            {{CONTACT_BAR}}
            <div class="top-rule"></div>
        </header>
        <section>
            <h2>Professional Summary</h2>
            <div class="rule"></div>
            <p class="summary-block">{{SUMMARY_TEXT}}</p>
        </section>
        <section style="display: {{SKILLS_DISPLAY}};">
            <h2>Technical Skills</h2>
            <div class="rule"></div>
            <div class="skills-lines">{{SKILLS_LINES}}</div>
        </section>
        <section class="section-experience" style="display: {{EXPERIENCE_DISPLAY}};">
            <h2>Professional Experience</h2>
            <div class="rule"></div>
            {{EXPERIENCE}}
        </section>
        <section class="section-achievements" style="display: {{ACHIEVEMENTS_DISPLAY}};">
            <h2>Selected Achievements</h2>
            <div class="rule"></div>
            <div class="edu">{{ACHIEVEMENTS}}</div>
        </section>
        <section class="section-education" style="display: {{EDUCATION_DISPLAY}};">
            <h2>Education</h2>
            <div class="rule"></div>
            <div class="edu">{{EDUCATION}}</div>
        </section>
    </div>
</body>
</html>
