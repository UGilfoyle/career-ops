<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cover Letter — {{NAME}}</title>
  <style>
    :root {
      --accent: #0f766e;
      --text: #111827;
      --text-muted: #4b5563;
      --paper: #ffffff;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
      background: var(--paper);
      color: var(--text);
      line-height: 1.45;
      font-size: 10.5pt;
    }
    .top-accent {
      height: 10px;
      width: 100%;
      background: var(--accent);
    }
    .page {
      max-width: 720px;
      margin: 0 auto;
      padding: 18px 40px 22px;
    }
    .sender {
      margin-bottom: 10px;
    }
    .sender-name {
      font-size: 15pt;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.02em;
      margin-bottom: 4px;
    }
    .sender-details {
      font-size: 9.5pt;
      color: var(--text-muted);
      line-height: 1.45;
    }
    .sender-details a {
      color: var(--text-muted);
      text-decoration: none;
    }
    .date {
      font-size: 9.5pt;
      color: var(--text);
      margin-bottom: 8px;
      font-weight: 600;
    }
    .date:empty {
      display: none;
    }
    .recipient {
      margin-bottom: 16px;
      font-size: 9.5pt;
      line-height: 1.4;
    }
    .recipient-name {
      font-weight: 700;
      color: var(--text);
    }
    .recipient-co {
      font-weight: 600;
      color: var(--text);
    }
    .recipient-role {
      color: var(--text-muted);
      font-weight: 500;
    }
    .salutation {
      font-size: 10.5pt;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text);
    }
    .content {
      font-size: 10.5pt;
      color: var(--text);
      text-align: left;
    }
    .content p {
      margin-bottom: 8px;
      text-align: justify;
      hyphens: auto;
    }
    .content p:last-child {
      margin-bottom: 0;
    }
    .closing-block {
      margin-top: 12px;
    }
    .closing-word {
      font-size: 10.5pt;
      margin-bottom: 8px;
      color: var(--text);
    }
    .signature-name {
      font-size: 12pt;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: -0.01em;
    }
    @media print {
      .page { padding: 0.45in 0.55in; max-width: 100%; }
    }
  </style>
</head>
<body>
  <div class="top-accent"></div>
  <div class="page">
    <header class="sender">
      <div class="sender-name">{{NAME}}</div>
      <div class="sender-details">{{COVER_SENDER_DETAILS}}</div>
    </header>

    <div class="salutation">Dear Hiring Manager,</div>

    <div class="content">
      {{COVER_LETTER_TEXT}}
    </div>

    <div class="closing-block">
      <div class="closing-word">Sincerely,</div>
      <div class="signature-name">{{NAME}}</div>
    </div>
  </div>
</body>
</html>
