<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{NAME}} - Resume</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        @page { size: A4; margin: 0.42in; }
        html, body {
            background: #fff;
            hyphens: none;
            -webkit-hyphens: none;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        @media print {
            body { padding: 0 !important; }
            a { color: #111; text-decoration: none; }
        }
        .contact:empty { display: none; }
        .contact a { color: #0284c7; text-decoration: none; }
        .contact-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-start;
            align-items: center;
            gap: 4px 14px;
            margin-top: 4px;
        }
        .contact-item {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 8.5pt;
            color: #475569;
            line-height: 1.4;
            white-space: nowrap;
            font-weight: 500;
        }
        .contact-icon {
            width: 10px;
            height: 10px;
            flex-shrink: 0;
            color: #0284c7;
        }
        .contact-bar:empty { display: none; }
        .job { page-break-inside: avoid; break-inside: avoid-page; }
        .job-header { page-break-after: avoid; break-after: avoid; }
        .job-header > div:first-child { flex: 1; min-width: 0; }
        .job-dates { white-space: nowrap; flex-shrink: 0; }
        .job li, .summary-block, .edu {
            hyphens: none;
            -webkit-hyphens: none;
            overflow-wrap: break-word;
            word-break: keep-all;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 9.5pt;
            line-height: 1.42;
            color: #0f172a;
            padding: 0.42in;
            -webkit-font-smoothing: antialiased;
        }
        .container { max-width: 100%; margin: 0 auto; }
        header { text-align: left; margin-bottom: 12px; }
        h1 {
            font-size: 20pt; font-weight: 800; letter-spacing: -0.03em;
            text-transform: none; margin-bottom: 4px; line-height: 1.12;
            color: #0f172a;
        }
        .contact { font-size: 8.5pt; color: #475569; line-height: 1.4; margin-bottom: 2px; font-weight: 500; }
        .top-rule { margin-top: 8px; height: 2px; background: linear-gradient(to right, #0284c7, #6366f1); border-radius: 1px; border: none; }
        section { margin-top: 11px; }
        h2 {
            font-size: 9.5pt; font-weight: 800; letter-spacing: 0.6px;
            text-transform: uppercase; margin-bottom: 3px; color: #0f172a;
        }
        .rule { border-top: 1.5px solid #e2e8f0; margin-bottom: 6px; }
        .skills-lines { font-size: 9pt; line-height: 1.42; color: #334155; }
        .skill-line { margin-bottom: 3px; }
        .skill-label { font-weight: 700; color: #0f172a; }
        .job { margin-bottom: 10px; }
        .job-header {
            display: flex; justify-content: space-between; align-items: baseline;
            gap: 12px; font-size: 9.5pt; margin-bottom: 2px;
        }
        .job-title { font-weight: 700; color: #0f172a; }
        .job-company { font-weight: 600; color: #0284c7; }
        .job-dates { font-weight: 600; color: #64748b; font-size: 8.5pt; font-variant-numeric: tabular-nums; }
        .job ul { list-style-type: disc; margin: 2px 0 0 1.2em; padding: 0; }
        .job li { margin-bottom: 2.5px; padding-left: 2px; line-height: 1.38; color: #334155; }
        .summary-block { font-size: 9pt; line-height: 1.45; color: #334155; white-space: pre-line; }
        .edu { font-size: 9pt; line-height: 1.38; color: #334155; }
        .edu > div { margin-bottom: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>{{NAME}}</h1>
            {{CONTACT_BAR}}
            <div class="top-rule"></div>
        </header>
        <section>
            <h2>Professional Summary</h2>
            <div class="rule"></div>
            <p class="summary-block">{{SUMMARY_TEXT}}</p>
        </section>
        <section style="display: {{SKILLS_DISPLAY}};">
            <h2>Technical Skills</h2>
            <div class="rule"></div>
            <div class="skills-lines">{{SKILLS_LINES}}</div>
        </section>
        <section style="display: {{EXPERIENCE_DISPLAY}};">
            <h2>Professional Experience</h2>
            <div class="rule"></div>
            {{EXPERIENCE}}
        </section>
        <section style="display: {{ACHIEVEMENTS_DISPLAY}};">
            <h2>Selected Achievements</h2>
            <div class="rule"></div>
            <div class="edu">{{ACHIEVEMENTS}}</div>
        </section>
        <section style="display: {{EDUCATION_DISPLAY}};">
            <h2>Education</h2>
            <div class="rule"></div>
            <div class="edu">{{EDUCATION}}</div>
        </section>
    </div>
</body>
</html>
