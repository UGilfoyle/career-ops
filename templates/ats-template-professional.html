<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{NAME}} - Resume</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        @page { size: A4; margin: 0.42in; }
        html, body { background: #fff; }
        @media print {
            body { padding: 0 !important; }
            a { color: #111; text-decoration: none; }
        }
        .contact:empty { display: none; }
        .contact a { color: #111; text-decoration: none; }
        .contact-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 4px 16px;
            margin-top: 5px;
        }
        .contact-item {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 9pt;
            color: #1a1a1a;
            line-height: 1.35;
            white-space: nowrap;
        }
        .contact-icon {
            width: 10.5px;
            height: 10.5px;
            flex-shrink: 0;
            color: #111111;
            opacity: 1;
        }
        .contact-text a {
            color: #1a1a1a;
            text-decoration: none;
        }
        @media print {
            .contact-icon { color: #000; }
            .contact-item, .contact-text a { color: #000; }
        }
        .contact-bar:empty { display: none; }
        .job { page-break-inside: avoid; }
        .job-header > div:first-child { flex: 1; min-width: 0; }
        .job-dates { white-space: nowrap; flex-shrink: 0; }
        .skills-list {
            list-style-type: disc;
            margin: 2px 0 0 1.15em;
            padding: 0;
            columns: 2;
            column-gap: 1.75em;
        }
        .skills-list li {
            margin-bottom: 3px;
            break-inside: avoid;
            line-height: 1.4;
            padding-left: 2px;
        }
        
        body {
            font-family: Calibri, "Segoe UI", Arial, Helvetica, sans-serif;
            font-size: 10pt;
            line-height: 1.32;
            color: #1a1a1a;
            padding: 0.4in;
            -webkit-font-smoothing: antialiased;
        }
        .container { max-width: 100%; margin: 0 auto; }
        header { text-align: center; margin-bottom: 8px; }
        h1 {
            font-family: Georgia, "Times New Roman", Times, serif;
            font-size: 18pt; font-weight: 700; letter-spacing: 0.4px;
            text-transform: none; margin-bottom: 4px; line-height: 1.12;
            color: #111;
        }
        .contact { font-size: 9pt; color: #334155; line-height: 1.35; margin-bottom: 2px; }
        .top-rule { margin-top: 6px; border-top: 1.5px solid #111; }
        section { margin-top: 8px; }
        h2 {
            font-family: Georgia, "Times New Roman", Times, serif;
            font-size: 10.5pt; font-weight: 700; letter-spacing: 0.2px;
            text-transform: none; margin-bottom: 2px; color: #111;
        }
        .rule { border-top: 1px solid #111; margin-bottom: 4px; }
        .skills-lines { font-size: 9.5pt; line-height: 1.35; color: #1e293b; }
        .skill-line { margin-bottom: 2px; }
        .skill-label { font-weight: 700; color: #111; }
        .job { margin-bottom: 7px; }
        .job-header {
            display: flex; justify-content: space-between; align-items: baseline;
            gap: 10px; font-size: 10pt; margin-bottom: 2px;
        }
        .job-title { font-weight: 700; font-style: italic; color: #111; }
        .job-company { font-weight: 700; color: #111; }
        .job-dates { font-weight: 600; color: #111; font-size: 9.5pt; }
        .job ul { list-style-type: disc; margin: 2px 0 0 1.1em; padding: 0; }
        .job li { margin-bottom: 1.5px; padding-left: 1px; line-height: 1.32; color: #1a1a1a; }
        .summary-block { font-size: 9.5pt; line-height: 1.38; color: #1a1a1a; white-space: pre-line; }
        .edu { font-size: 9.5pt; line-height: 1.32; color: #1a1a1a; }
        .edu > div { margin-bottom: 3px; }

    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>{{NAME}}</h1>
            {{CONTACT_BAR}}
            <div class="top-rule"></div>
        </header>
        <section>
            <h2>Professional Summary</h2>
            <div class="rule"></div>
            <p class="summary-block">{{SUMMARY_TEXT}}</p>
        </section>

        <section style="display: {{EXPERIENCE_DISPLAY}};">
            <h2>Professional Experience</h2>
            <div class="rule"></div>
            {{EXPERIENCE}}
        </section>
        <section style="display: {{ACHIEVEMENTS_DISPLAY}};">
            <h2>Selected Achievements</h2>
            <div class="rule"></div>
            <div class="edu">{{ACHIEVEMENTS}}</div>
        </section>
        <section style="display: {{EDUCATION_DISPLAY}};">
            <h2>Education</h2>
            <div class="rule"></div>
            <div class="edu">{{EDUCATION}}</div>
        </section>
        <section style="display: {{SKILLS_DISPLAY}};">
            <h2>Technical Skills</h2>
            <div class="rule"></div>
            <div class="skills-lines">{{SKILLS_LINES}}</div>
        </section>
    </div>

</body>
</html>
