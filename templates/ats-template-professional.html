<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{NAME}} - Resume</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        @page {
            size: A4;
            margin: 0.55in;
        }

        html, body {
            background: #fff;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 10.5pt;
            line-height: 1.35;
            color: #111;
            /* Screen preview parity — print uses @page only */
            padding: 0.55in;
            -webkit-font-smoothing: antialiased;
        }

        @media print {
            body { padding: 0; }
            a { color: #111; text-decoration: none; }
        }

        .container {
            max-width: 100%;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 18pt;
            font-weight: 800;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            margin-bottom: 8px;
            line-height: 1.15;
        }

        .contact {
            font-size: 9pt;
            color: #222;
            line-height: 1.45;
            margin-bottom: 3px;
        }

        .contact:empty { display: none; }

        .contact a {
            color: #111;
            text-decoration: none;
        }

        .top-rule {
            margin-top: 12px;
            border-top: 2px solid #111;
        }

        section {
            margin-top: 14px;
        }

        h2 {
            font-size: 10pt;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .rule {
            border-top: 1px solid #111;
            margin-bottom: 8px;
        }

        .skills-lines { font-size: 9.5pt; line-height: 1.4; }
        .skill-line { margin-bottom: 4px; }
        .skill-label { font-weight: 800; }

        .job {
            margin-bottom: 12px;
            page-break-inside: avoid;
        }

        .job-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 12px;
            font-size: 9.5pt;
            margin-bottom: 4px;
        }

        .job-header > div:first-child {
            flex: 1;
            min-width: 0;
        }

        .job-title { font-weight: 800; }
        .job-company { font-weight: 600; }
        .job-dates { font-weight: 700; white-space: nowrap; flex-shrink: 0; }

        .job ul {
            list-style-type: disc;
            margin: 4px 0 0 1.15em;
            padding: 0;
        }

        .job li {
            margin-bottom: 3px;
            padding-left: 2px;
            line-height: 1.38;
        }

        .summary-block {
            font-size: 9.5pt;
            line-height: 1.45;
            color: #222;
            white-space: pre-line;
            text-align: left;
        }

        .edu { font-size: 9.5pt; line-height: 1.4; }
        .edu > div { margin-bottom: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>{{NAME}}</h1>
            <div class="contact">{{CONTACT_LINE}}</div>
            <div class="contact">{{LINKS_LINE}}</div>
            <div class="top-rule"></div>
        </header>

        <section>
            <h2>Professional Summary</h2>
            <div class="rule"></div>
            <p class="summary-block">{{SUMMARY_TEXT}}</p>
        </section>

        <section style="display: {{SKILLS_DISPLAY}};">
            <h2>Technical Skills</h2>
            <div class="rule"></div>
            <div class="skills-lines">
                {{SKILLS_LINES}}
            </div>
        </section>

        <section style="display: {{EXPERIENCE_DISPLAY}};">
            <h2>Professional Experience</h2>
            <div class="rule"></div>
            {{EXPERIENCE}}
        </section>

        <section style="display: {{ACHIEVEMENTS_DISPLAY}};">
            <h2>Selected Achievements</h2>
            <div class="rule"></div>
            <div class="edu">
                {{ACHIEVEMENTS}}
            </div>
        </section>

        <section style="display: {{EDUCATION_DISPLAY}};">
            <h2>Education</h2>
            <div class="rule"></div>
            <div class="edu">
                {{EDUCATION}}
            </div>
        </section>
    </div>
</body>
</html>
