name: Dashboard v2 Build Check

on:
  push:
    branches:
      - main
    paths:
      - "dashboard-v2/**"
      - ".github/workflows/dashboard-v2-build.yml"
  pull_request:
    paths:
      - "dashboard-v2/**"
      - ".github/workflows/dashboard-v2-build.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard-v2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: dashboard-v2/pnpm-lock.yaml

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: |
            dashboard-v2/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('dashboard-v2/pnpm-lock.yaml') }}-${{ hashFiles('dashboard-v2/src/**.[jt]s', 'dashboard-v2/src/**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('dashboard-v2/pnpm-lock.yaml') }}-
            ${{ runner.os }}-nextjs-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build application
        env:
          AUTH_SECRET: ci-build-secret
          DATABASE_URL: postgres://user:pass@localhost:5432/career_ops_ci
        run: pnpm run build
