<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Career-Ops Companion</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Catppuccin Mocha Palette */
      --bg-crust: #11111b;
      --bg-mantle: #181825;
      --bg-base: #1e1e2e;
      --bg-surface0: #313244;
      --text: #cdd6f4;
      --text-sub: #a6adc8;
      --blue: #89b4fa;
      --green: #a6e3a1;
      --mauve: #cba6f7;
      --yellow: #f9e2af;
      --red: #f38ba8;
      --font-family: 'Inter', system-ui, sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-family);
      background-color: var(--bg-base);
      color: var(--text);
      width: 360px;
      padding: 16px;
      overflow-x: hidden;
    }

    /* ─── HEADER ─── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--bg-surface0);
      padding-bottom: 12px;
      margin-bottom: 16px;
    }

    .logo {
      font-size: 16px;
      font-weight: 700;
      color: var(--mauve);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .logo span {
      color: var(--blue);
    }

    .status-badge {
      font-size: 10px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 20px;
      background-color: var(--bg-crust);
      border: 1px solid var(--bg-surface0);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--red);
    }

    .status-dot.online {
      background-color: var(--green);
    }

    /* ─── CARD LAYOUTS ─── */
    .card {
      background-color: var(--bg-mantle);
      border: 1px solid var(--bg-surface0);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px;
      transition: all 0.2s ease-in-out;
    }

    .card-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-sub);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* ─── JOB DETECTED CARD ─── */
    .job-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.4;
      margin-bottom: 4px;
    }

    .job-company {
      font-size: 12px;
      color: var(--blue);
      font-weight: 500;
      margin-bottom: 12px;
    }

    .job-metadata {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-sub);
      background-color: var(--bg-crust);
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--bg-surface0);
    }

    .fit-score {
      font-weight: 700;
      color: var(--yellow);
    }

    /* ─── CANDIDATE CARD ─── */
    .profile-info {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 12px;
    }

    .profile-row {
      display: flex;
      justify-content: space-between;
      color: var(--text-sub);
    }

    .profile-val {
      font-weight: 500;
      color: var(--text);
    }

    /* ─── BUTTONS ─── */
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 10px 14px;
      border-radius: 8px;
      border: none;
      font-family: var(--font-family);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease-in-out;
    }

    .btn-primary {
      background-color: var(--blue);
      color: var(--bg-crust);
    }

    .btn-primary:hover {
      background-color: #a4c5ff;
      transform: translateY(-1px);
    }

    .btn-secondary {
      background-color: var(--bg-surface0);
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .btn-secondary:hover {
      background-color: #3f4057;
      transform: translateY(-1px);
    }

    .btn-disabled {
      background-color: var(--bg-surface0);
      color: var(--text-sub);
      cursor: not-allowed;
      opacity: 0.6;
    }

    .actions-grid {
      display: grid;
      grid-template-cols: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }

    /* ─── ALERTS / MESSAGE ─── */
    .message-box {
      font-size: 11px;
      padding: 10px;
      border-radius: 8px;
      background-color: var(--bg-crust);
      border-left: 3px solid var(--mauve);
      margin-top: 12px;
      display: none;
    }

    .loader {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 2px solid var(--text-sub);
      border-radius: 50%;
      border-top-color: transparent;
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  
  <!-- Header -->
  <div class="header">
    <div class="logo">
      Career-Ops <span>Companion</span>
    </div>
    <div style="display: flex; align-items: center; gap: 8px;">
      <button id="btn-toggle-settings" style="background: none; border: none; color: var(--text-sub); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 4px; border-radius: 4px;" title="Configure Backend URL">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
      </button>
      <div class="status-badge">
        <div id="status-dot" class="status-dot"></div>
        <span id="status-text">Connecting...</span>
      </div>
    </div>
  </div>

  <!-- Settings Panel -->
  <div class="card" id="settings-card" style="display: none; padding: 12px; margin-bottom: 14px; border-color: var(--mauve);">
    <div class="card-title" style="margin-bottom: 8px;">Backend Configuration</div>
    <div style="display: flex; gap: 8px;">
      <input type="text" id="input-backend-url" style="flex: 1; padding: 8px; border-radius: 6px; border: 1px solid var(--bg-surface0); background: var(--bg-crust); color: var(--text); font-size: 11px; font-family: inherit;" placeholder="http://localhost:4242">
      <button id="btn-save-backend" style="padding: 6px 12px; background: var(--blue); color: var(--bg-crust); border: none; border-radius: 6px; font-weight: 700; font-size: 11px; font-family: inherit; cursor: pointer; transition: opacity 0.15s;" onmouseover="this.style.opacity='0.9'" onmouseout="this.style.opacity='1'">Save</button>
    </div>
  </div>

  <!-- Job Scraped Card -->
  <div class="card" id="job-card">
    <div class="card-title">
      <span>Detected Job Details</span>
      <span id="job-status" class="fit-score">Detecting...</span>
    </div>
    <div id="job-details-view">
      <div id="job-title" class="job-title">Navigating page...</div>
      <div id="job-company" class="job-company">Please open a job posting.</div>
      <div class="job-metadata">
        <span>Autofill availability:</span>
        <span id="autofill-indicator" style="color: var(--red); font-weight: bold;">Inactive</span>
      </div>
    </div>
  </div>

  <!-- Profile Card -->
  <div class="card" id="profile-card">
    <div class="card-title">Active Candidate Profile</div>
    <div class="profile-info" id="profile-info-view">
      <div class="profile-row">
        <span>Name:</span>
        <span id="profile-name" class="profile-val">—</span>
      </div>
      <div class="profile-row">
        <span>Email:</span>
        <span id="profile-email" class="profile-val">—</span>
      </div>
      <div class="profile-row">
        <span>Target Comp:</span>
        <span id="profile-comp" class="profile-val">—</span>
      </div>
    </div>
  </div>

  <!-- Action Buttons -->
  <button id="btn-autofill" class="btn btn-primary btn-disabled" disabled>
    Auto-Fill Application Form
  </button>

  <div class="actions-grid">
    <button id="btn-tailor" class="btn btn-secondary" title="Tailor resume PDF for this job">
      Tailor Resume
    </button>
    <button id="btn-eval" class="btn btn-secondary" title="Create pipeline evaluation report">
      Evaluate Job
    </button>
  </div>

  <!-- Console Log / Message Output -->
  <div class="message-box" id="msg-box">
    Hello
  </div>

  <script src="popup.js"></script>
</body>
</html>
